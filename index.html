<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サムネ参考 純感動12ch ビューワ</title>
<style>
  body { font-family: 'Yu Gothic UI', sans-serif; background: #1a1a1a; color: #eee; margin: 0; padding: 20px; }
  h1 { margin: 0 0 10px; font-size: 20px; }
  .ctl { background: #2a2a2a; padding: 12px; border-radius: 6px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .ctl label { font-size: 13px; }
  .ctl select, .ctl input[type=number], .ctl input[type=text] { background: #3a3a3a; color: #eee; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
  .ctl button { background: #4a8; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .ctl button:hover { background: #5b9; }
  .stats { font-size: 12px; color: #aaa; }
  .ch-section { margin-bottom: 30px; }
  .ch-header { font-size: 16px; padding: 8px 12px; background: #2a2a2a; border-left: 4px solid #4a8; margin-bottom: 12px; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { background: #2a2a2a; border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.1s; }
  .card:hover { transform: scale(1.03); }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .meta { padding: 6px 8px; font-size: 11px; }
  .vc { color: #ffd; font-weight: bold; }
  .ttl { color: #ccc; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 100; align-items: center; justify-content: center; }
  #modal.show { display: flex; }
  #modal img { max-width: 92vw; max-height: 92vh; }
  #modal .info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 8px 14px; border-radius: 4px; }
</style>
</head>
<body>
<h1>サムネ参考 純感動12ch ビューワ</h1>

<div class="ctl">
  <label>チャンネル:
    <select id="ch"><option value="">全て</option></select>
  </label>
  <label>最低再生数:
    <input type="number" id="minvc" value="0" step="10000" style="width:120px">
  </label>
  <label>並び:
    <select id="sort">
      <option value="vc_desc">再生数 多→少</option>
      <option value="vc_asc">再生数 少→多</option>
      <option value="ch">チャンネル順</option>
    </select>
  </label>
  <label>表示数:
    <input type="number" id="limit" value="500" step="50" style="width:80px">
  </label>
  <label>検索:
    <input type="text" id="q" placeholder="タイトルキーワード">
  </label>
  <button onclick="render()">適用</button>
  <span class="stats" id="stats"></span>
</div>

<div id="content"></div>

<div id="modal" onclick="this.classList.remove('show')">
  <img id="modal-img">
  <div class="info" id="modal-info"></div>
</div>

<script>
// 各チャンネルのフォルダ名を列挙(手書き不要にPHP不可なのでlistはサーバから不可。代わりにmanifest.jsonで実現する場合)
// → シンプルに、ページロード時にfetchでチャンネルフォルダを取得しようとするとローカルfsアクセス問題があるのでscript経由で動的にロードしない。
// 代わりにビルド時にgenerate.pyで埋め込む方式 — ここでは初期は空にして、generate.pyが後でDATA配列を差し込む。
// 実装簡略化: 自動生成された data.js を読み込む方式
</script>
<script src="data.js"></script>
<script>
// data.js は配列 DATA = [{ch:'...', vid:'...', vc:..., title:'...', file:'...'}] を提供する

function uniqueChannels() {
  const s = new Set();
  DATA.forEach(d => s.add(d.ch));
  return [...s];
}

function init() {
  const sel = document.getElementById('ch');
  uniqueChannels().forEach(c => {
    const o = document.createElement('option'); o.value=c; o.textContent=c;
    sel.appendChild(o);
  });
  render();
}

function render() {
  const chFilter = document.getElementById('ch').value;
  const minVC = parseInt(document.getElementById('minvc').value) || 0;
  const sort = document.getElementById('sort').value;
  const limit = parseInt(document.getElementById('limit').value) || 500;
  const q = document.getElementById('q').value.trim();

  let filtered = DATA.filter(d => {
    if (chFilter && d.ch !== chFilter) return false;
    if (d.vc < minVC) return false;
    if (q && !d.title.includes(q)) return false;
    return true;
  });

  if (sort === 'vc_desc') filtered.sort((a,b) => b.vc - a.vc);
  else if (sort === 'vc_asc') filtered.sort((a,b) => a.vc - b.vc);
  else if (sort === 'ch') filtered.sort((a,b) => a.ch.localeCompare(b.ch) || b.vc - a.vc);

  filtered = filtered.slice(0, limit);

  document.getElementById('stats').textContent = `表示中: ${filtered.length}本 / 全${DATA.length}本`;

  const content = document.getElementById('content');
  content.innerHTML = '';

  // チャンネル別表示(sort=chの場合)
  if (sort === 'ch') {
    const groups = {};
    filtered.forEach(d => { (groups[d.ch] = groups[d.ch] || []).push(d); });
    for (const ch of Object.keys(groups)) {
      const sec = document.createElement('div'); sec.className='ch-section';
      sec.innerHTML = `<div class="ch-header">${ch} (${groups[ch].length}本)</div><div class="grid"></div>`;
      const grid = sec.querySelector('.grid');
      groups[ch].forEach(d => grid.appendChild(card(d)));
      content.appendChild(sec);
    }
  } else {
    const grid = document.createElement('div'); grid.className='grid';
    filtered.forEach(d => grid.appendChild(card(d)));
    content.appendChild(grid);
  }
}

function card(d) {
  const div = document.createElement('div'); div.className='card';
  const path = `${encodeURIComponent(d.ch)}/${encodeURIComponent(d.file)}`;
  div.innerHTML = `<img src="${path}" loading="lazy" onclick='openModal(${JSON.stringify(d).replace(/'/g, "\\'")})'>
    <div class="meta">
      <div class="vc">${d.vc.toLocaleString()}回 · ${d.ch}</div>
      <div class="ttl">${d.title}</div>
    </div>`;
  return div;
}

function openModal(d) {
  const path = `${encodeURIComponent(d.ch)}/${encodeURIComponent(d.file)}`;
  document.getElementById('modal-img').src = path;
  document.getElementById('modal-info').textContent = `${d.ch} | ${d.vc.toLocaleString()}回 | ${d.title}`;
  document.getElementById('modal').classList.add('show');
}

init();
</script>
</body>
</html>
